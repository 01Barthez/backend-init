name: Bug report
description: Something is broken or behaving incorrectly
title: '[bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve this template. Include enough detail to reproduce.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened vs what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.0.0 or SHA
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local
        - Docker Compose
        - VPS / production
        - CI
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
