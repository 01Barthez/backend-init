name: Deploy VPS

on:
  workflow_run:
    workflows: [Docker]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag to deploy (e.g. main, latest, sha-<40hex>, v1.2.3). Empty = main'
        required: false
        default: 'main'

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Resolve image reference
        id: image
        run: |
          set -euo pipefail
          REGISTRY="${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}"
          NAME="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="${REGISTRY}/${NAME}"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Pin to the exact commit the Docker workflow built (immutable).
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
            TAG="sha-${HEAD_SHA}"
          else
            TAG="${{ inputs.image_tag }}"
            if [ -z "${TAG}" ]; then
              TAG="main"
            fi
          fi

          REF="${IMAGE}:${TAG}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${REF}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          # Optional: PAT with read:packages if the GHCR package is private
          GHCR_USER: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
          HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Non-default SSH port (e.g. 2222). Omit secret → 22.
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          # Forward env into the remote shell
          envs: IMAGE_REF,GHCR_USER,GHCR_TOKEN,APP_PATH,HEALTH_URL
          script: |
            set -euo pipefail

            APP_DIR="${APP_PATH:?VPS_APP_PATH secret is required}"
            cd "${APP_DIR}"

            COMPOSE="infra/docker/docker-compose.deploy.yml"

            if [ ! -f "${COMPOSE}" ]; then
              echo "Missing ${COMPOSE} — VPS_APP_PATH must be the repo root checkout."
              exit 1
            fi

            if [ ! -f .env ]; then
              echo "Missing root .env — copy from .env.example and set production values."
              exit 1
            fi

            if [ ! -d keys ] || [ -z "$(ls -A keys/*.pem 2>/dev/null || true)" ]; then
              echo "Missing JWT PEMs under ${APP_DIR}/keys — run keys:generate on the host first."
              exit 1
            fi

            # Login to GHCR when pulling a private package
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER:-${USER}}" --password-stdin
            fi

            export IMAGE_REF
            printf 'IMAGE_REF=%s\n' "${IMAGE_REF}" > .env.image

            docker compose \
              -f "${COMPOSE}" \
              --env-file .env \
              --env-file .env.image \
              pull backend-api backend-worker

            docker compose \
              -f "${COMPOSE}" \
              --env-file .env \
              --env-file .env.image \
              up -d --remove-orphans

            # Prefer repo variable DEPLOY_HEALTH_URL (e.g. https://api.example.com/health/live)
            HEALTH="${HEALTH_URL:-http://127.0.0.1/health/live}"
            echo "Waiting for ${HEALTH} …"
            ok=0
            for i in $(seq 1 40); do
              if curl -fsS "${HEALTH}" >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 3
            done
            if [ "${ok}" != "1" ]; then
              echo "Health check failed after deploy"
              docker compose -f "${COMPOSE}" --env-file .env --env-file .env.image ps
              docker compose -f "${COMPOSE}" --env-file .env --env-file .env.image logs --tail=80 backend-api || true
              exit 1
            fi
            echo "Deploy OK: ${IMAGE_REF}"

      - name: Summary
        run: |
          {
            echo "## VPS deploy"
            echo ""
            echo "- **Image:** \`${{ steps.image.outputs.ref }}\`"
            echo "- **Environment:** \`production\`"
          } >> "$GITHUB_STEP_SUMMARY"
