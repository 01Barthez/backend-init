services:
  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      network: host
    container_name: ${APP_NAME:-backend_api}
    env_file: ../../.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # ClamAV can take 1–5 minutes on first boot while freshclam downloads signatures.
      # If CLAMAV_REQUIRED=false in .env the API degrades gracefully at runtime,
      # but Compose still blocks here until the healthcheck passes.
      # Remove this entry (clamav + the clamav service) if antivirus is not needed.
      clamav:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped
    environment:
      DATABASE_URL: 'mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?replicaSet=rs0&authSource=admin'
      REDIS_PORT: '6379'
      SMTP_PORT: '1025'
      MINIO_PORT: '9000'
      CLAMAV_PORT: '3310'
      REDIS_PASSWORD: ''
      # Overridable for load tests: MAX_GLOBAL_QUERY_NUMBER=50000 docker compose up -d backend
      MAX_GLOBAL_QUERY_NUMBER: ${MAX_GLOBAL_QUERY_NUMBER:-100}
      MAX_UNIQ_QUERY_NUMBER: ${MAX_UNIQ_QUERY_NUMBER:-200}
      MAX_AUTH_QUERY_NUMBER: ${MAX_AUTH_QUERY_NUMBER:-10}
    volumes:
      # RSA PEMs generated on the host (`npm run keys:generate`). Read-only in the container.
      - ../../keys:/app/keys:ro
    ports:
      - '${PORT:-3000}:3000'
    networks:
      - backend_network

  mongo:
    image: mongo:6.0-jammy
    container_name: ${MONGO_NAME:-mongo_db}
    restart: unless-stopped
    entrypoint: ['/scripts/start-mongo.sh']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-securepassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-admin}
    volumes:
      - mongo_keyfile:/mongo-keyfile:rw
      - ../scripts/start-mongo.sh:/scripts/start-mongo.sh:ro
      - mongo_data:/data/db
    ports:
      - '${MONGO_PORT:-27017}:27017'
    networks:
      - backend_network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  mongo-backup:
    image: mongo:6.0
    profiles: [tools]
    volumes:
      - ./backups:/backups
    environment:
      - MONGO_URI=${MONGO_URL:-mongodb://admin:securepassword@mongo:27017/admin?replicaSet=rs0&authSource=admin}
    entrypoint: |
      bash -c 'while true; do
        echo "Running backup at $(date)"
        mongodump --uri="$$MONGO_URI" --gzip --archive=/backups/dump_$$(date +%Y%m%d_%H%M%S).gz
        sleep 86400
      done'
    depends_on:
      - mongo
    networks:
      - backend_network

  redis:
    image: redis:8-alpine
    container_name: ${REDIS_NAME:-redis_cache}
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    networks:
      - backend_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5

  redisinsight:
    image: redis/redisinsight:2.54.0
    container_name: ${REDISINSIGHT_NAME:-redisinsight}
    profiles: [tools]
    ports:
      - '${REDISINSIGHT_PORT:-8001}:5540'
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - backend_network
    volumes:
      - redisinsight_data:/data
    environment:
      - REDIS_HOSTS=local:redis:6379

  # Dev-only data browser. Not for production. Prefer `npm run prisma:studio` on the host.
  prisma-studio:
    image: node:22-bookworm-slim
    container_name: ${PRISMA_STUDIO_NAME:-prisma_studio}
    profiles: [tools]
    working_dir: /app
    volumes:
      - ../..:/app
    command:
      [
        'npx',
        'prisma',
        'studio',
        '--schema',
        'prisma/',
        '--hostname',
        '0.0.0.0',
        '--port',
        '5555',
        '--browser',
        'none',
      ]
    environment:
      DATABASE_URL: 'mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-secret123}@mongo:27017/${MONGO_DB:-appDB}?replicaSet=rs0&authSource=admin'
    ports:
      - '${PRISMA_STUDIO_PORT:-5555}:5555'
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - backend_network
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-10-25T06-33-25Z
    container_name: ${MINIO_NAME:-minio_storage}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001" --address ":9000"
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE:-9001}:9001'
    volumes:
      - minio_data:/data
    networks:
      - backend_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/ready']
      interval: 30s
      timeout: 10s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: MINIO_INITIALIZER
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/scripts/init-minio.sh']
    restart: on-failure
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_APP_BUCKET: ${MINIO_APP_BUCKET:-app-uploads}
      MINIO_BACKUP_BUCKET: ${MINIO_BACKUP_BUCKET:-backups}
    volumes:
      - ../scripts/init-minio.sh:/scripts/init-minio.sh:ro
    networks:
      - backend_network

  mailhog:
    image: mailhog/mailhog
    container_name: ${SMTP_NAME:-mail}
    restart: unless-stopped
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${SMTP_WEB_UI:-8025}:8025'
    networks:
      - backend_network

  nginx:
    image: nginx:stable-alpine
    container_name: ${NGINX_NAME:-nginx}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '${NGINX_PORT:-80}:80'
      # Port 443 is commented out by default: TLS termination belongs at the load balancer
      # (AWS ALB, GCP LB, Cloudflare, Caddy, etc.), not inside this Nginx container.
      # To terminate TLS here, uncomment this line, mount a certificate, and add an ssl
      # server block to infra/nginx/default.conf.
      # - '${NGINX_HTTPS_PORT:-443}:443'
    networks:
      - backend_network

  clamav:
    image: clamav/clamav:1.0.9
    container_name: ${CLAMAV_NAME:-clamav}
    environment:
      - CLAMAV_NO_CLAMD=false
      - CLAMAV_NO_FRESHCLAMD=false
      - CLAMD_STARTUP_TIMEOUT=600
      - CLAMD_STARTUP_SLEEP=60
      - CLAMD_CONNECT_TIMEOUT=60
      - CLAMD_STREAM_MAX_LENGTH=100M
      - FRESHCLAM_CHECKS=4
      - CLAMD_HOST=0.0.0.0
      - CLAMD_EXTRA_ARGS=--foreground --stream-max-ratio=300 --max-queue=100 --max-threads=8
      - FRESHCLAM_MOD=3600
      - FRESHCLAM_ONLYREQUIRED=1
    volumes:
      - clamav_data:/var/lib/clamav
      - ../monitoring/clamav/clamd.conf:/etc/clamav/clamd.conf
      - clamav_logs:/var/log/clamav
    ports:
      - '${CLAMAV_PORT:-3310}:3310'
    networks:
      - backend_network
    healthcheck:
      test: ['CMD', 'clamdscan', '--version']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
    command: ['sh', '-c', 'freshclam --daemon --stdout && clamd --foreground']
    restart: unless-stopped

volumes:
  mongo_data:
  mongo_keyfile:
  minio_data:
  clamav_data:
  clamav_logs:
  redisinsight_data:

networks:
  backend_network:
    driver: bridge
    attachable: true
