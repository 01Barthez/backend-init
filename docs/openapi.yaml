openapi: 3.0.3
info:
  title: 'Backend Init API'
  description: "Production-ready Express + TypeScript backend template.\n\nFeatures: JWT authentication (RS256), OAuth 2.0, email OTP verification,\nuser management, file uploads (MinIO), Redis caching, and scheduled jobs.\n\nProtected routes require: `Authorization: Bearer <access_token>`"
  version: 1.0.0
  contact:
    name: 'Barthez Kenwou'
    email: kenwoubarthez@gmail.com
    url: 'https://github.com/barthez/backend-init'
  license:
    name: MIT
    url: 'https://opensource.org/licenses/MIT'
servers:
  -
    url: 'http://localhost:3000/api/v1'
    description: 'Local development'
tags:
  -
    name: Authentication
    description: 'Signup, login, OTP, password management'
  -
    name: Users
    description: 'User profile and administration'
  -
    name: OAuth
    description: 'Social login (Google, GitHub, etc.)'
  -
    name: Blogs
    description: 'Reference blog domain (template validation)'
  -
    name: System
    description: 'Health checks and security endpoints'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT access token obtained after login'
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: 507f1f77bcf86cd799439011
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string
          nullable: true
        isActive:
          type: boolean
        isVerified:
          type: boolean
        role:
          type: string
          enum:
            - USER
            - ADMIN
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Blog:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          nullable: true
        content:
          type: string
        coverImage:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - DRAFT
            - REVIEW
            - PUBLISHED
            - ARCHIVED
        visibility:
          type: string
          enum:
            - PUBLIC
            - PRIVATE
            - MEMBERS_ONLY
        authorId:
          type: string
        views:
          type: integer
        likes:
          type: integer
        shares:
          type: integer
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          nullable: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
paths:
  /auth/signup:
    post:
      tags:
        - Authentication
      summary: 'Register a new user'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - password
                - firstName
                - lastName
                - phone
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
                profile:
                  type: string
                  format: binary
      responses:
        '201':
          description: 'User created, OTP sent'
        '409':
          description: 'Email already exists'
  /auth/verify:
    post:
      tags:
        - Authentication
      summary: 'Verify account with OTP'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                otp:
                  type: string
      responses:
        '200':
          description: 'Account verified'
  /auth/login:
    post:
      tags:
        - Authentication
      summary: 'Login with email and password'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: 'Login successful'
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: 'Logout and revoke tokens'
      security:
        -
          bearerAuth: []
      responses:
        '200':
          description: 'Logged out'
  /users:
    get:
      tags:
        - Users
      summary: 'List users (paginated)'
      parameters:
        -
          name: page
          in: query
          schema:
            type: integer
            default: 1
        -
          name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 'User list'
  '/users/{userId}':
    get:
      tags:
        - Users
      summary: 'Get user by ID'
      parameters:
        -
          name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'User details'
  '/auth/oauth/{provider}':
    get:
      tags:
        - OAuth
      summary: 'Initiate OAuth flow'
      parameters:
        -
          name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - google
              - github
              - facebook
              - instagram
              - twitter
              - linkedin
      responses:
        '302':
          description: 'Redirect to provider'
