# Users routes — /api/v1/users
# Keep in sync with src/modules/users/presentation/routes/users.routes.ts
# Own identity with roles/permissions: GET /api/v1/auth/me

/api/v1/users/profile:
  put:
    tags: [Users]
    summary: Update own profile
    description: Updates the authenticated user profile. Optional avatar via multipart field `profile`.
    security:
      - bearerAuth: []
    requestBody:
      required: false
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              firstName: { type: string }
              lastName: { type: string }
              phone: { type: string, minLength: 5, maxLength: 20 }
              profile: { type: string, format: binary }
    responses:
      '200': { description: Profile updated }
      '401': { description: Missing or invalid authentication }

/api/v1/users/profile/avatar:
  delete:
    tags: [Users]
    summary: Remove own avatar
    security:
      - bearerAuth: []
    responses:
      '200': { description: Avatar removed }

/api/v1/users/me:
  delete:
    tags: [Users]
    summary: Delete own account
    description: Soft-deletes the authenticated account and revokes sessions.
    security:
      - bearerAuth: []
    responses:
      '200': { description: Account deleted }

/api/v1/users/invite:
  post:
    tags: [Users]
    summary: Invite a user
    description: Creates a verified+active user and emails a set-password link. Requires `user:update:any`.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, firstName, lastName]
            properties:
              email: { type: string, format: email }
              firstName: { type: string }
              lastName: { type: string }
              phone: { type: string }
              role: { type: string, enum: [admin, user, guest], default: user }
    responses:
      '201': { description: User invited }
      '409': { description: Email already exists }

/api/v1/users:
  get:
    tags: [Users]
    summary: List users
    description: Paginated list. Requires `user:read:any`. Limit max 100.
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        schema: { type: integer, minimum: 1, default: 1 }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      - name: isActive
        in: query
        schema: { type: boolean }
      - name: isVerified
        in: query
        schema: { type: boolean }
      - name: isDeleted
        in: query
        schema: { type: boolean }
      - name: search
        in: query
        schema: { type: string }
    responses:
      '200': { description: Paginated user list }

/api/v1/users/search:
  get:
    tags: [Users]
    summary: Search users
    description: Paginated free-text search. Requires `user:read:any`. Limit max 50.
    security:
      - bearerAuth: []
    parameters:
      - name: search
        in: query
        required: true
        schema: { type: string, minLength: 1, maxLength: 100 }
      - name: page
        in: query
        schema: { type: integer, minimum: 1, default: 1 }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    responses:
      '200': { description: Paginated search results }

/api/v1/users/export:
  get:
    tags: [Users]
    summary: Export users
    description: CSV export max 10_000 rows. Requires `user:export`.
    security:
      - bearerAuth: []
    parameters:
      - name: isActive
        in: query
        schema: { type: boolean }
      - name: isVerified
        in: query
        schema: { type: boolean }
      - name: search
        in: query
        schema: { type: string }
    responses:
      '200': { description: CSV download }

/api/v1/users/{userId}:
  get:
    tags: [Users]
    summary: Get user by ID
    description: Admin detail with roles. Requires `user:read:any`.
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200': { description: User details }
  patch:
    tags: [Users]
    summary: Admin update user profile
    description: Requires `user:update:any`. Does not change email or password.
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200': { description: User updated }
  delete:
    tags: [Users]
    summary: Soft-delete user
    description: Requires `user:delete:any`.
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200': { description: User soft-deleted }

/api/v1/users/{userId}/role:
  put:
    tags: [Users]
    summary: Assign user role
    description: Assignable slugs `admin` | `user` | `guest`. Requires `user:role:assign`.
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [role]
            properties:
              role:
                type: string
                enum: [admin, user, guest]
    responses:
      '200': { description: Role updated }

/api/v1/users/{userId}/activate:
  post:
    tags: [Users]
    summary: Activate user
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200': { description: User activated }

/api/v1/users/{userId}/deactivate:
  post:
    tags: [Users]
    summary: Deactivate user
    description: Also revokes all sessions.
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200': { description: User deactivated }

/api/v1/users/{userId}/verify-email:
  post:
    tags: [Users]
    summary: Mark email verified
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200': { description: Email verified }

/api/v1/users/{userId}/unlock:
  post:
    tags: [Users]
    summary: Unlock login lockout
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200': { description: User unlocked }

/api/v1/users/{userId}/revoke-sessions:
  post:
    tags: [Users]
    summary: Revoke all sessions
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200': { description: Sessions revoked }

/api/v1/users/{userId}/permanent:
  delete:
    tags: [Users]
    summary: Permanently delete user
    description: GDPR anonymize + conditional row drop. Requires `user:delete:any`.
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200': { description: User permanently deleted }

/api/v1/users/{userId}/restore:
  post:
    tags: [Users]
    summary: Restore soft-deleted user
    description: Reactivates when verified. Requires `user:update:any`.
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200': { description: User restored }
