# Authentication routes — /api/v1/auth
# Keep in sync with src/modules/auth/presentation/routes/auth.routes.ts

/api/v1/auth/signup:
  post:
    tags: [Authentication]
    summary: Register a new user
    description: Creates a user account and sends an email OTP for verification. Optional profile image via multipart field `profile`.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [email, password, firstName, lastName, phone]
            properties:
              email: { type: string, format: email }
              password: { type: string, minLength: 8 }
              firstName: { type: string }
              lastName: { type: string }
              phone: { type: string, minLength: 5, maxLength: 20 }
              profile: { type: string, format: binary }
    responses:
      '201': { description: User created; OTP sent to email }
      '400': { description: Validation failed }
      '409': { description: Email already exists }
      '500': { description: Unexpected server error }

/api/v1/auth/verify:
  post:
    tags: [Authentication]
    summary: Verify account with OTP
    description: Confirms the email OTP and returns an authenticated session (JWT pair).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, otp]
            properties:
              email: { type: string, format: email }
              otp: { type: string, minLength: 4, maxLength: 8 }
    responses:
      '200': { description: Account verified; tokens issued }
      '400': { description: Validation failed }
      '401': { description: Invalid OTP }
      '500': { description: Unexpected server error }

/api/v1/auth/resend-otp:
  post:
    tags: [Authentication]
    summary: Resend verification OTP
    description: Sends a new one-time password when the account exists and is unverified. Response is identical for unknown emails (no enumeration).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email }
    responses:
      '200': { description: Accepted (OTP sent when applicable) }
      '400': { description: Validation failed }
      '429': { description: Too many attempts }
      '500': { description: Unexpected server error }

/api/v1/auth/login:
  post:
    tags: [Authentication]
    summary: Login with email and password
    description: Authenticates credentials and issues a JWT access token plus refresh cookie/token.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string, format: email }
              password: { type: string }
    responses:
      '200': { description: Login successful }
      '400': { description: Validation failed }
      '401': { description: Invalid credentials }
      '403': { description: Account inactive or unverified }
      '429': { description: Account locked or rate limited }
      '500': { description: Unexpected server error }

/api/v1/auth/refresh:
  post:
    tags: [Authentication]
    summary: Refresh access token
    description: Issues a new access token using the refresh token from the HTTP-only cookie or JSON body field `refreshToken`.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              refreshToken: { type: string }
    responses:
      '200': { description: Token refreshed }
      '400': { description: Missing refresh token }
      '401': { description: Invalid or expired refresh token }
      '500': { description: Unexpected server error }

/api/v1/auth/forgot-password:
  post:
    tags: [Authentication]
    summary: Request password reset
    description: Always returns the same success payload. A single-use opaque token is emailed only when the account exists (no user enumeration).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email }
    responses:
      '200': { description: Generic accepted response }
      '400': { description: Validation failed }
      '429': { description: Too many attempts }
      '500': { description: Unexpected server error }

/api/v1/auth/reset-password:
  post:
    tags: [Authentication]
    summary: Reset password with token
    description: Consumes a single-use opaque `resetToken` from the email (JSON body, not the URL) and revokes all sessions.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [resetToken, new_password]
            properties:
              resetToken: { type: string }
              new_password: { type: string, minLength: 8 }
    responses:
      '200': { description: Password reset successful }
      '400': { description: Validation failed }
      '422': { description: Invalid or expired reset token }
      '429': { description: Too many attempts }
      '500': { description: Unexpected server error }

/api/v1/auth/logout:
  post:
    tags: [Authentication]
    summary: Logout and revoke session
    description: Clears the refresh cookie, blacklists the access `jti`, and revokes the refresh family. Account `isActive` is unchanged. Requires a verified user.
    security:
      - bearerAuth: []
    responses:
      '200': { description: Logged out }
      '401': { description: Missing or invalid authentication }
      '403': { description: Account not verified or inactive }
      '500': { description: Unexpected server error }

/api/v1/auth/change-password:
  post:
    tags: [Authentication]
    summary: Change password (authenticated)
    description: Updates the password for the current verified, active user.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [current_password, new_password]
            properties:
              current_password: { type: string }
              new_password: { type: string, minLength: 8 }
    responses:
      '200': { description: Password changed }
      '400': { description: Validation failed }
      '401': { description: Missing authentication or wrong current password }
      '403': { description: Account not verified or inactive }
      '500': { description: Unexpected server error }

/api/v1/auth/me:
  get:
    tags: [Authentication]
    summary: Current user
    description: Fresh account snapshot including roles and permissions. Requires a verified account.
    security:
      - bearerAuth: []
    responses:
      '200': { description: Current user profile }
      '401': { description: Missing or invalid authentication }
      '403': { description: Account not verified }

/api/v1/auth/sessions:
  get:
    tags: [Authentication]
    summary: List refresh-token sessions
    description: Refresh-token families for the authenticated user. Requires verified + active account.
    security:
      - bearerAuth: []
    responses:
      '200': { description: Session families }
      '401': { description: Missing or invalid authentication }
      '403': { description: Account not verified or inactive }

/api/v1/auth/sessions/{familyId}:
  delete:
    tags: [Authentication]
    summary: Revoke one session family
    description: Revokes one device/session family. Requires verified + active account.
    security:
      - bearerAuth: []
    parameters:
      - name: familyId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    responses:
      '200': { description: Session revoked }
      '401': { description: Missing or invalid authentication }
      '403': { description: Account not verified or inactive }
      '404': { description: Session not found }

/api/v1/auth/totp/enroll:
  post:
    tags: [Authentication]
    summary: Start TOTP enrollment
    description: Returns an otpauth URL and secret once. TOTP is not enabled until confirm.
    security:
      - bearerAuth: []
    responses:
      '200': { description: otpauth URL and secret }
      '401': { description: Missing or invalid authentication }
      '403': { description: Account not verified or inactive }
      '409': { description: TOTP already enabled }

/api/v1/auth/totp/confirm:
  post:
    tags: [Authentication]
    summary: Confirm TOTP enrollment
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [totpCode]
            properties:
              totpCode: { type: string, minLength: 6, maxLength: 8 }
    responses:
      '200': { description: TOTP enabled }
      '400': { description: Validation failed }
      '401': { description: Missing or invalid authentication }
      '403': { description: Account not verified or inactive }

/api/v1/auth/totp/disable:
  post:
    tags: [Authentication]
    summary: Disable TOTP
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [totpCode, current_password]
            properties:
              totpCode: { type: string, minLength: 6, maxLength: 8 }
              current_password: { type: string }
    responses:
      '200': { description: TOTP disabled }
      '400': { description: Validation failed }
      '401': { description: Missing or invalid authentication }
      '403': { description: Account not verified or inactive }
