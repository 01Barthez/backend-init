openapi: 3.0.3
info:
  title: 'Backend Init API'
  description: "Production-ready Express + TypeScript backend template.\n\nFeatures: JWT authentication (RS256), OAuth 2.0, email OTP verification,\nuser management, file uploads (MinIO), Redis caching, and scheduled jobs.\n\n**Authentication:** send `Authorization: Bearer <access_token>` on protected routes.\nRefresh tokens are typically stored in an HTTP-only cookie; `/auth/refresh` also accepts `refreshToken` in the JSON body.\n\n**Base paths:** domain APIs live under `/api/v1`. System endpoints (`/health`, `/csrf-token`, `/metrics`, CSP report URI, Bull Board) are mounted at the application root."
  version: 1.0.0
  contact:
    name: 'Barthez Kenwou'
    email: kenwoubarthez@gmail.com
    url: 'https://github.com/barthez-kenwou/backend-init'
  license:
    name: MIT
    url: 'https://opensource.org/licenses/MIT'
servers:
  - url: 'http://localhost:3000'
    description: 'Local development'
tags:
  - name: Authentication
    description: 'Signup, login, OTP verification, token refresh, and password management'
  - name: OAuth
    description: 'Social login providers, Telegram auth, account linking and unlinking'
  - name: Users
    description: 'Profile updates and administrative user management'
  - name: Blogs
    description: 'Reference blog domain used to validate the modular template'
  - name: System
    description: 'Health, CSRF, Prometheus metrics, CSP reports, and Bull Board admin UI'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT access token issued by login, verify, refresh, or OAuth flows'
    basicAuth:
      type: http
      scheme: basic
      description: 'HTTP Basic credentials for Bull Board (SWAGGER_USER / SWAGGER_PASSWORD)'
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: 507f1f77bcf86cd799439011
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string
          nullable: true
        isActive:
          type: boolean
        isVerified:
          type: boolean
        role:
          type: string
          enum:
            - USER
            - ADMIN
            - MODERATOR
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Blog:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          nullable: true
        content:
          type: string
        coverImage:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - DRAFT
            - REVIEW
            - PUBLISHED
            - ARCHIVED
        visibility:
          type: string
          enum:
            - PUBLIC
            - PRIVATE
            - MEMBERS_ONLY
        authorId:
          type: string
        views:
          type: integer
        likes:
          type: integer
        shares:
          type: integer
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
          description: 'May also be set as an HTTP-only cookie'
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
          nullable: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 10
    OAuthAccount:
      type: object
      properties:
        provider:
          type: string
          enum:
            - google
            - github
            - facebook
            - instagram
            - twitter
            - linkedin
            - telegram
          description: 'OAuth provider identifier'
        providerUserId:
          type: string
        email:
          type: string
          format: email
          nullable: true
        linkedAt:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: 'Validation failed or malformed request'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 'Missing or invalid authentication'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 'Authenticated but lacking required permission or role'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 'Resource not found'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 'Conflict with existing resource state'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: 'Unexpected server error'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
paths:
  /api/v1/auth/signup:
    post:
      tags:
        - Authentication
      summary: 'Register a new user'
      description: 'Creates a user account and sends an email OTP for verification. Optional profile image via multipart field `profile`.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - password
                - firstName
                - lastName
                - phone
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  description: 'Must include uppercase, lowercase, number, and symbol'
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
                  minLength: 5
                  maxLength: 20
                profile:
                  type: string
                  format: binary
                  description: 'Optional avatar image'
      responses:
        '201':
          description: 'User created; OTP sent to email'
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - { type: object, properties: { data: { $ref: '#/components/schemas/User' } } }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/verify:
    post:
      tags:
        - Authentication
      summary: 'Verify account with OTP'
      description: 'Confirms the email OTP and returns an authenticated session (JWT pair).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  minLength: 4
                  maxLength: 8
      responses:
        '200':
          description: 'Account verified; tokens issued'
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - {
                      type: object,
                      properties: { data: { $ref: '#/components/schemas/TokenPair' } },
                    }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/resend-otp:
    post:
      tags:
        - Authentication
      summary: 'Resend verification OTP'
      description: 'Sends a new one-time password to the given email address.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: 'OTP resent successfully'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: 'Login with email and password'
      description: 'Authenticates credentials and issues a JWT access token plus refresh cookie/token.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: 'Login successful'
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - {
                      type: object,
                      properties: { data: { $ref: '#/components/schemas/TokenPair' } },
                    }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: 'Refresh access token'
      description: 'Issues a new access token using the refresh token from the HTTP-only cookie or JSON body field `refreshToken`.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: 'Optional when the refresh cookie is present'
      responses:
        '200':
          description: 'Token refreshed'
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - {
                      type: object,
                      properties: { data: { $ref: '#/components/schemas/TokenPair' } },
                    }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: 'Request password reset'
      description: 'Sends a password-reset link/token to the user email when the account exists.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: 'Reset instructions sent when the account exists'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  '/api/v1/auth/reset-password/{resetToken}':
    post:
      tags:
        - Authentication
      summary: 'Reset password with token'
      description: 'Sets a new password using the reset token from the email link. The Express route also accepts an optional path segment (`/reset-password/:resetToken?`).'
      parameters:
        - name: resetToken
          in: path
          required: true
          schema:
            type: string
          description: 'Password reset token from the email link'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - new_password
              properties:
                new_password:
                  type: string
                  minLength: 8
                  description: 'Must include uppercase, lowercase, number, and symbol'
      responses:
        '200':
          description: 'Password reset successful'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: 'Logout and revoke session'
      description: 'Clears the refresh cookie and revokes the current session. Requires a verified, active user.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'Logged out'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/change-password:
    post:
      tags:
        - Authentication
      summary: 'Change password (authenticated)'
      description: 'Updates the password for the current verified, active user.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
                  description: 'Must include uppercase, lowercase, number, and symbol'
      responses:
        '200':
          description: 'Password changed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/oauth/accounts:
    get:
      tags:
        - OAuth
      summary: 'List linked OAuth accounts'
      description: 'Returns social accounts linked to the authenticated user.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'Linked OAuth accounts'
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - {
                      type: object,
                      properties:
                        {
                          data:
                            { type: array, items: { $ref: '#/components/schemas/OAuthAccount' } },
                        },
                    }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/oauth/telegram:
    post:
      tags:
        - OAuth
      summary: 'Authenticate with Telegram Login Widget'
      description: 'Validates Telegram Login Widget payload (`hash` required) and issues JWT credentials.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hash
              properties:
                id:
                  type: integer
                first_name:
                  type: string
                last_name:
                  type: string
                username:
                  type: string
                photo_url:
                  type: string
                auth_date:
                  type: integer
                hash:
                  type: string
                  description: 'Telegram widget integrity hash'
      responses:
        '200':
          description: 'Telegram login successful'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  '/api/v1/auth/oauth/{provider}':
    get:
      tags:
        - OAuth
      summary: 'Start OAuth authorization'
      description: 'Redirects the browser to the selected OAuth provider consent screen.'
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - google
              - github
              - facebook
              - instagram
              - twitter
              - linkedin
              - telegram
            description: 'OAuth provider identifier'
      responses:
        '302':
          description: 'Redirect to the OAuth provider'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  '/api/v1/auth/oauth/{provider}/callback':
    get:
      tags:
        - OAuth
      summary: 'OAuth provider callback'
      description: 'Handles the provider redirect, exchanges the authorization code, and completes login or account linking.'
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - google
              - github
              - facebook
              - instagram
              - twitter
              - linkedin
              - telegram
            description: 'OAuth provider identifier'
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: 'Authorization code from the provider'
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: 'CSRF/state value from the authorize step'
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: 'Provider error code when consent is denied'
      responses:
        '302':
          description: 'Redirect to the frontend success or error URL'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  '/api/v1/auth/oauth/{provider}/unlink':
    delete:
      tags:
        - OAuth
      summary: 'Unlink an OAuth provider'
      description: 'Removes the linked social account for the given provider from the current user.'
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - google
              - github
              - facebook
              - instagram
              - twitter
              - linkedin
              - telegram
            description: 'OAuth provider identifier'
      responses:
        '200':
          description: 'Provider unlinked'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/users/profile:
    put:
      tags:
        - Users
      summary: 'Update own profile'
      description: 'Updates the authenticated user profile. Optional avatar via multipart field `profile`.'
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
                  minLength: 5
                  maxLength: 20
                profile:
                  type: string
                  format: binary
      responses:
        '200':
          description: 'Profile updated'
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - { type: object, properties: { data: { $ref: '#/components/schemas/User' } } }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/users:
    get:
      tags:
        - Users
      summary: 'List users'
      description: 'Returns a paginated user list. Requires `user:read:any`.'
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: isVerified
          in: query
          schema:
            type: boolean
        - name: isDeleted
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: 'Paginated user list'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { type: array, items: { $ref: '#/components/schemas/User' } }
                  pagination: { $ref: '#/components/schemas/PaginationMeta' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/users/search:
    get:
      tags:
        - Users
      summary: 'Search users'
      description: 'Searches users by name or email. Requires `user:read:any`.'
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: 'Search term'
      responses:
        '200':
          description: 'Matching users'
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - {
                      type: object,
                      properties:
                        { data: { type: array, items: { $ref: '#/components/schemas/User' } } },
                    }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/users/export:
    get:
      tags:
        - Users
      summary: 'Export users'
      description: 'Exports users (typically CSV/file download). Requires `user:export`.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'Export payload or file download'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/users/clear-all:
    delete:
      tags:
        - Users
      summary: 'Clear all users'
      description: 'Destructive admin operation that clears user records. Requires `user:delete:any`. Registered before `/:userId` so the path is not captured as an id.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'Users cleared'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  '/api/v1/users/{userId}':
    get:
      tags:
        - Users
      summary: 'Get user by ID'
      description: 'Returns a single user. Requires `user:read:any`.'
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'User details'
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - { type: object, properties: { data: { $ref: '#/components/schemas/User' } } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Users
      summary: 'Soft-delete user'
      description: 'Soft-deletes the user. Requires `user:delete:any`.'
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'User soft-deleted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
